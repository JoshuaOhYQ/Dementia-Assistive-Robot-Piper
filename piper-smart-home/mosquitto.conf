# PIPER — Mosquitto broker configuration (development)
#
# Windows:  save this next to mosquitto.exe (usually C:\Program Files\mosquitto\)
#           then run in an Administrator terminal:
#               "C:\Program Files\mosquitto\mosquitto.exe" -c mosquitto.conf -v
#           (-v = verbose: you see every packet, which is gold for the report)
#
# The default Mosquitto 2.x config refuses anything except localhost, which is
# why a freshly installed broker "doesn't work" with the ESP32. These two
# listeners fix that.

# --- plain MQTT: the ESP32 and the Python backend -------------------------
listener 1883 0.0.0.0

# --- MQTT over WebSockets: the browser dashboard --------------------------
listener 9001 0.0.0.0
protocol websockets

# Development only. Anyone on your LAN can control the house.
# For the final demo, switch this off and add the password file below.
allow_anonymous true

# --- Production-ish setup (uncomment for the final build) -----------------
# allow_anonymous false
# password_file C:\Program Files\mosquitto\passwd
#   create it with:  mosquitto_passwd -c passwd piper
#   then set PIPER_MQTT_USER / PIPER_MQTT_PASS and MQTT_USER / MQTT_PASS
#   in the firmware. Mention this in the report's privacy section — the
#   report claims local-only processing, and an open broker undercuts that.

# --- Logging ---------------------------------------------------------------
log_type all
connection_messages true
log_timestamp true

# Keep retained state across broker restarts, so the backend still knows the
# house state after a power cut.
persistence true
